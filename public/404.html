<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="fonts/fonts.css">
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — humarains</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--accent:#0284c7;--text:#0f172a;--text2:#334155;--text3:#64748b;--grad:linear-gradient(135deg,#bae6fd 0%,#fed7aa 52%,#fbcfe8 100%)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--grad);background-attachment:fixed;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Hanken Grotesk',sans-serif;color:var(--text);padding:24px;text-align:center}
.card{background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);border:1px solid rgba(2,132,199,0.14);border-radius:22px;padding:64px 48px;max-width:480px;width:100%;box-shadow:0 24px 64px rgba(2,132,199,0.12)}
.big{font-family:'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:96px;font-weight:600;line-height:1;color:#0284c7;margin-bottom:8px}
h1{font-size:24px;font-weight:700;margin-bottom:12px}
p{color:var(--text2);font-size:15px;line-height:1.7;margin-bottom:32px}
a{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#38bdf8,#0284c7);color:#fff;font-weight:600;font-size:14px;padding:12px 28px;border-radius:10px;text-decoration:none;box-shadow:0 4px 16px rgba(2,132,199,0.32);transition:transform .2s,box-shadow .2s}
a:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(2,132,199,0.42)}
</style>
<style id='404-light-override'>
:root {
  --grad: linear-gradient(135deg, #EDF3FA 0%, #EEF7F9 50%, #F8EFE5 100%);
  --text: #111111; --text2: #6B6B6B;
}
body { font-family: 'Hanken Grotesk', system-ui, sans-serif !important; background: var(--grad) !important; background-attachment: fixed !important; }
.card { background: rgba(255,255,255,0.85) !important; border-color: #E7E2DD !important; border-radius: 28px !important; }
h1 { color: #111111 !important; }
p { color: #6B6B6B !important; }
a { background: #0B252A !important; box-shadow: 0 4px 16px rgba(11,37,42,.22) !important; border-radius: 10px !important; }
a:hover { background: #406E7A !important; }
</style>
<link rel="stylesheet" href="typography.css?v=1">
</head>
<body>
<div class="card">
  <div class="big">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
  <a href="index.html">← Back to humarains</a>
</div>
</body>
</html>
